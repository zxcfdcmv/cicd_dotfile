harbor:
  expose:
    type: ClusterIP
    tls:
      enabled: false
  ingress:
    enabled: true
    hosts:
      core: harbor.local
    annotations:
      kubernetes.io/ingress.class: nginx

  persistence:
    enabled: true
    persistentVolumeClaim:
      registry:
        storageClass: local-path
        size: 5Gi
      chartmuseum:
        storageClass: local-path
        size: 2Gi
      jobservice:
        storageClass: local-path
        size: 1Gi
      database:
        storageClass: local-path
        size: 1Gi
      redis:
        storageClass: local-path
        size: 1Gi
      trivy:
        storageClass: local-path
        size: 2Gi

  harborAdminPassword: Harbor12345

  metrics:
    enabled: true

  trivy:
    enabled: true
