apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  # 如果需要，在这里添加注解，例如：
  # annotations:
  #   nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx # 指定你的 Ingress Controller
  rules:
  - host: nginx.local    # 你的域名
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service # 你的后端 Service 名称
            port:
              number: 80
