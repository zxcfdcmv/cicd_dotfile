apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:zxcfdcmv/cicd_dotfile.git
    targetRevision: main
    path: charts/harbor  # 存放 values.yaml 的目录
    helm:
      valueFiles:
      - values.yaml
      # 指定从外部 Helm 仓库拉取 Chart
      chart: harbor
      repoURL: https://helm.goharbor.io
      targetRevision: 1.12.x
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
