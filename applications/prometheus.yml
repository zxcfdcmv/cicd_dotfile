apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:zxcfdcmv/cicd_dotfile.git
    targetRevision: main
    path: charts/prometheus  # 存放 values.yaml 的目录
    helm:
      valueFiles:
      - values.yaml
      # 指定从外部 Helm 仓库拉取 Chart
      chart: kube-prometheus-stack
      repoURL: https://helm.goharbor.io
      targetRevision: 88.x
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
